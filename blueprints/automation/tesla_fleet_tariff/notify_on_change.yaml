blueprint:
  name: Powerwall - Notify when the rate plan changes
  description: >-
    Runs your actions (e.g. a phone notification) every time the Tesla Fleet
    Tariff integration actually sends a new rate plan to the Powerwall.


    Variables for your actions:

    * `notify_title` - the title you set below (default "Powerwall - Rate Plan
    Changed")

    * `plan_message` - "Pushed: Normal rate plan" or "Pushed: Power Down
    (18:00 - 19:00)"

    * `summary`, `plan_name`, `kind`, `reason` - the raw details


    Example action: notify.mobile_app_<your_phone> with title
    "{{ notify_title }}" and message "{{ plan_message }}".
  domain: automation
  author: Tesla Fleet Tariff
  input:
    powerwall:
      name: Powerwall / energy site
      selector:
        device:
          filter:
            - integration: tesla_fleet
    title:
      name: Notification title
      default: Powerwall - Rate Plan Changed
      selector:
        text:
    notify_actions:
      name: Actions
      description: >-
        E.g. notify.mobile_app_<your_phone> with title "{{ notify_title }}"
        and message "{{ plan_message }}".
      selector:
        action: {}

mode: queued

triggers:
  - trigger: event
    event_type: tesla_fleet_tariff_pushed

variables:
  powerwall: !input powerwall
  notify_title: !input title
  kind: "{{ trigger.event.data.kind }}"
  reason: "{{ trigger.event.data.reason }}"
  summary: "{{ trigger.event.data.summary }}"
  plan_name: "{{ trigger.event.data.plan_name }}"
  plan_message: "{{ trigger.event.data.message }}"

conditions:
  - condition: template
    value_template: "{{ trigger.event.data.device_id == powerwall }}"

actions: !input notify_actions
