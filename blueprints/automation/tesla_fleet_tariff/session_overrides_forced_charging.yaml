blueprint:
  name: Powerwall - Export session overrides forced charging
  description: >-
    For setups where another automation force-charges the Powerwall in cheap
    slots (e.g. switching to backup mode during Octopus Intelligent Go
    dispatches): an export session (e.g. Octopus Power Down) takes priority.


    * When a session starts and the Powerwall is in the force-charge mode,
    run your "normal" scene so it can export (retries once after a minute).

    * When the session ends and the cheap-slot sensor is still on (within
    the allowed hours), run your "charge" scene again.


    Also add a condition to your force-charge automation so it doesn't start
    force-charging while the session calendar is on.
  domain: automation
  author: Tesla Fleet Tariff
  input:
    session_calendar:
      name: Export session calendar
      description: >-
        On while a session is running, e.g.
        calendar.octopus_energy_<account>_octoplus_power_down.
      selector:
        entity:
          filter:
            - domain: calendar
    operation_mode:
      name: Powerwall operation mode
      selector:
        entity:
          filter:
            - domain: select
              integration: tesla_fleet
    forced_mode:
      name: Operation mode that means "force charging"
      default: backup
      selector:
        select:
          custom_value: true
          options: ["backup", "self_consumption", "autonomous"]
    normal_scene:
      name: Scene that returns the Powerwall to normal (Time-Based Control)
      selector:
        entity:
          filter:
            - domain: scene
    charge_scene:
      name: Scene that force-charges (optional)
      default: []
      selector:
        entity:
          filter:
            - domain: scene
    cheap_slot_sensor:
      name: Cheap-slot sensor (optional)
      description: >-
        On during cheap / dispatch slots, e.g. the Octopus Energy integration's
        binary_sensor.octopus_energy_electricity_<meter>_<mpan>_off_peak.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
    resume_after:
      name: Only resume charging after
      default: "05:31:00"
      selector:
        time:
    resume_before:
      name: Only resume charging before
      default: "20:30:00"
      selector:
        time:
    notify_actions:
      name: Notification actions (optional)
      description: The variable `message` describes what happened.
      default: []
      selector:
        action: {}

mode: queued

variables:
  operation_mode: !input operation_mode
  forced_mode: !input forced_mode
  charge_scene: !input charge_scene
  cheap_slot_sensor: !input cheap_slot_sensor

triggers:
  - trigger: state
    entity_id: !input session_calendar
    from: "off"
    to: "on"
    id: session_start
  - trigger: state
    entity_id: !input session_calendar
    from: "on"
    to: "off"
    id: session_end

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: session_start
          - condition: template
            value_template: "{{ is_state(operation_mode, forced_mode) }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input normal_scene
          - delay: "00:01:00"
          - if:
              - condition: template
                value_template: "{{ is_state(operation_mode, forced_mode) }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: !input normal_scene
          - variables:
              message: Export session started - stopped forced charging so the Powerwall can export.
          - sequence: !input notify_actions
      - conditions:
          - condition: trigger
            id: session_end
          - condition: template
            value_template: >-
              {{ charge_scene not in ([], '', none) and cheap_slot_sensor not in ([], '', none)
                 and is_state(cheap_slot_sensor, 'on') }}
          - condition: time
            after: !input resume_after
            before: !input resume_before
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input charge_scene
          - variables:
              message: Export session ended - resumed forced charging for the cheap slot.
          - sequence: !input notify_actions
