blueprint:
  name: Powerwall - Follow demand sessions
  description: >-
    Changes your Powerwall's rate plan for your supplier's demand sessions,
    such as Octopus Power Down (paid to export) or Power Up (free
    electricity), and puts your normal plan back when the day's last session
    ends.


    * **Export sessions** become Peak, so the Powerwall exports during them.

    * **Free sessions** are priced at £0, so the Powerwall charges. It can
    empty the battery first, so there's room to refill.

    * Sessions for today go in straight away; later days go in at midnight.
    Tesla is only updated when the plan actually changes.


    Create one automation per session type, and run the "Powerwall - Set
    normal rate plan" script first. Uses the Tesla Fleet Tariff integration.
  domain: automation
  author: Tesla Fleet Tariff
  input:
    sessions:
      name: Sessions
      icon: mdi:calendar-clock
      input:
        powerwall:
          name: Powerwall
          selector:
            device:
              filter:
                - integration: tesla_fleet
        session_entity:
          name: Where the sessions come from
          description: >-
            The Octopus Energy integration's Power Down or Power Up events
            entity, or any calendar (e.g. a Local Calendar you add sessions
            to yourself).
          selector:
            entity:
              filter:
                - domain: event
                - domain: calendar
        session_name:
          name: Name
          description: Shown in notifications and the Tesla app, e.g. Power Down.
          default: Session
          selector:
            text:
    during:
      name: During a session
      icon: mdi:home-battery
      input:
        session_type:
          name: Session type
          default: export
          selector:
            select:
              options:
                - label: "Export: I'm paid to export (e.g. Power Down)"
                  value: export
                - label: "Free electricity (e.g. Power Up)"
                  value: free
        only_export_window:
          name: Make it the only export window that day
          description: >-
            On the session's day your normal Peak becomes Mid-Peak, so the
            session (or, for a free session, the window that empties the
            battery first) is the only time the Powerwall is paid to export.
          default: true
          selector:
            boolean:
    before:
      name: Before a free session
      icon: mdi:battery-arrow-down
      input:
        empty_first:
          name: Empty the battery first
          description: >-
            Exports just before the session, so there's room to refill for
            free. Back-to-back sessions count as one.
          default: true
          selector:
            boolean:
        pre_minutes:
          name: For how long
          description: Leave blank for the same length as the session.
          default:
          selector:
            number:
              min: 15
              max: 720
              step: 15
              unit_of_measurement: min
              mode: box
    advanced:
      name: Advanced
      icon: mdi:tune
      collapsed: true
      input:
        attribute:
          name: Which list to read
          description: >-
            Entity sources only. Automatic reads joined_events if the entity
            has it (Octopus Power Down: only sessions you've joined), otherwise
            events (Octopus Power Up).
          default: auto
          selector:
            select:
              custom_value: true
              options:
                - label: Automatic
                  value: auto
                - label: joined_events
                  value: joined_events
                - label: events
                  value: events
        activate:
          name: Sessions on a later day go into the plan
          default: event_day
          selector:
            select:
              options:
                - label: At midnight on the session's day
                  value: event_day
                - label: As soon as they're known
                  value: now
        label:
          name: Session label instead of the session type
          description: >-
            Use one of your normal plan's labels (and its prices) for the
            session instead: Peak for export, £0 for free. Blank = use the
            session type.
          default: ""
          selector:
            select:
              custom_value: true
              options: ["", "Peak", "Mid-Peak", "Off-Peak", "Super Off-Peak"]
        pre_label:
          name: Label for emptying the battery
          description: >-
            Blank = Peak. Setting a label here also empties the battery
            before export-type sessions.
          default: ""
          selector:
            select:
              custom_value: true
              options: ["", "Peak", "Mid-Peak", "Off-Peak", "Super Off-Peak"]
        relabel:
          name: Custom relabel for the session's day
          description: >-
            Replaces "Make it the only export window" with your own label
            changes, e.g. {"Peak": "Mid-Peak", "Mid-Peak": "Off-Peak"}.
            Leave empty to use the switch.
          default: {}
          selector:
            object:

mode: queued
max: 5

variables:
  source_entity: !input session_entity
  is_calendar: "{{ source_entity.startswith('calendar.') }}"
  powerwall_id: !input powerwall
  name_for_session: !input session_name
  session_type: !input session_type
  only_export_window: !input only_export_window
  empty_first: !input empty_first
  drain_minutes: !input pre_minutes
  list_attribute: !input attribute
  activate_when: !input activate
  label_override: !input label
  drain_label_override: !input pre_label
  relabel_override: !input relabel
  # What gets sent to tesla_fleet_tariff.sync_events, built from the answers
  # above. The advanced fields, when filled in, win over the simple ones.
  session_options: >-
    {% set is_free = session_type == 'free' %}
    {% set opts = dict(device_id=powerwall_id, activate=activate_when,
                       name=name_for_session) %}
    {% if label_override %}
      {% set opts = dict(opts, label=label_override) %}
    {% elif is_free %}
      {% set opts = dict(opts, buy_price=0) %}
    {% else %}
      {% set opts = dict(opts, label='Peak') %}
    {% endif %}
    {% if relabel_override %}
      {% set opts = dict(opts, relabel=relabel_override) %}
    {% elif only_export_window %}
      {% set opts = dict(opts, relabel={'Peak': 'Mid-Peak'}) %}
    {% endif %}
    {% set drain_label = drain_label_override
         or ('Peak' if is_free and empty_first else '') %}
    {% if drain_label %}
      {% if drain_minutes is none or drain_minutes == '' %}
        {% set opts = dict(opts, pre_label=drain_label) %}
      {% elif (drain_minutes | int(0)) > 0 %}
        {% set opts = dict(opts, pre_label=drain_label,
                           pre_minutes=drain_minutes | int) %}
      {% endif %}
    {% endif %}
    {{ opts }}

triggers:
  - trigger: state
    entity_id: !input session_entity
  - trigger: homeassistant
    event: start
  # Calendars don't announce new events, so check every 15 minutes. This is
  # cheap: Tesla is only called when the plan actually changes.
  - trigger: time_pattern
    minutes: /15

actions:
  - if:
      - condition: template
        value_template: "{{ is_calendar }}"
    then:
      - action: calendar.get_events
        target:
          entity_id: !input session_entity
        data:
          start_date_time: "{{ now().isoformat() }}"
          duration:
            days: 8
        response_variable: calendar_events
      - action: tesla_fleet_tariff.sync_events
        # Timed events only (all-day calendar entries are ignored).
        data: >-
          {{ dict(session_options, source=source_entity,
                  events=calendar_events[source_entity].events
                         | selectattr('start', 'search', 'T') | list) }}
    else:
      - action: tesla_fleet_tariff.sync_events
        data: >-
          {% if list_attribute in (none, '', 'auto') %}
            {{ dict(session_options, entity_id=source_entity) }}
          {% else %}
            {{ dict(session_options, entity_id=source_entity, attribute=list_attribute) }}
          {% endif %}
